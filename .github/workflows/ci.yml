name: CareerHub CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Optional: Testcontainers requires Docker. Ubuntu-latest has Docker installed.
    
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' # Use 10.0 since project uses net10.0

    - name: Restore dependencies
      run: dotnet restore CareerHub.sln || dotnet restore API.Tests/API.Tests.csproj

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release
